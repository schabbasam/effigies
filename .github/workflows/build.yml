name: Build Effigies

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install panda3d pyinstaller

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name Effigies \
            --collect-all panda3d \
            --add-data "assets:assets" \
            --add-data "user_data.json:." \
            main.py

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onedir `
            --name Effigies `
            --collect-all panda3d `
            --add-data "assets;assets" `
            --add-data "user_data.json;." `
            main.py

      - name: Include writable user data beside executable
        shell: bash
        run: cp user_data.json dist/Effigies/user_data.json

      - name: Package build
        shell: bash
        run: |
          cd dist
          python -c "import shutil; shutil.make_archive('../Effigies-${{ matrix.name }}', 'zip', 'Effigies')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Effigies-${{ matrix.name }}
          path: Effigies-${{ matrix.name }}.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Effigies-${{ matrix.name }}.zip
          generate_release_notes: true
